# The four local completion checks of docs/tasks/M1.md, on every push and PR.
# `uses:` entries are pinned to full commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Tests with the dev-ingest commands
        run: cargo test --workspace --all-features --locked

      - name: Tests of the default build
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
