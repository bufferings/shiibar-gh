# Updates the cask in bufferings/homebrew-tap when a release is published
# (never for a draft or a prerelease), from the cask template of the release
# tag and the sha256 of the published zip. Needs the TAP_PUSH_TOKEN secret.
name: Bump cask

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump-cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A release published under a tag_name that is not vX.Y.Z would point
      # the cask at a missing download, so the tap is left alone.
      - name: Check the release tag is vX.Y.Z
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag_name '$TAG' is not vX.Y.Z; the tap is not updated"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download the release zip and hash it
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "shiibar-gh-$version-arm64.zip" --dir dist
          sha256="$(shasum -a 256 "dist/shiibar-gh-$version-arm64.zip" | awk '{ print $1 }')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Check out bufferings/homebrew-tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: bufferings/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap

      - name: Render the cask and push
        env:
          VERSION: ${{ steps.asset.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          mkdir -p tap/Casks
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$SHA256/g" \
            packaging/homebrew/shiibar-gh.rb > tap/Casks/shiibar-gh.rb
          cd tap || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/shiibar-gh.rb
          if git diff --cached --quiet; then
            echo "the cask is unchanged"
            exit 0
          fi
          git commit -m "shiibar-gh $VERSION"
          git push
