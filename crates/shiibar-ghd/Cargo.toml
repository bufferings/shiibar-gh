[package]
name = "shiibar-ghd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only commands that inject events and fix the clock. Off in the default
# build, where the daemon rejects them as unknown commands.
dev-ingest = ["shiibar-gh-proto/dev-ingest"]

[dependencies]
shiibar-gh-proto = { path = "../shiibar-gh-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
