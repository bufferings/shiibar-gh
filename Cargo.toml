[workspace]
resolver = "2"
members = [
    "crates/shiibar-gh-proto",
    "crates/shiibar-gh-client",
    "crates/shiibar-ghd",
    "crates/shiibar-gh",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
anyhow = "1.0.104"
# Links the system libsqlite3 (DESIGN.md, state storage). The `bundled` feature
# stays off on purpose.
rusqlite = "0.41.1"
# Wall-clock Return time in the Mac's current time zone and in the IANA zone
# given to `dev_clock_set`. Reads the operating system's zoneinfo.
jiff = "0.2.38"
tempfile = "3.27.0"
