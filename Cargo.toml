[workspace]
resolver = "2"
members = [
    "crates/shiibar-gh-proto",
    "crates/shiibar-gh-client",
    "crates/shiibar-ghd",
    "crates/shiibar-gh",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
anyhow = "1.0.104"
# `bundled` compiles SQLite into the daemon (DESIGN.md, state storage). The
# system libsqlite3 differs across macOS versions, and the one in macOS 15 lacks
# symbols rusqlite 0.41.1 calls, such as `sqlite3_set_clientdata`. Through
# libsqlite3-sys 0.39.1 this bundles SQLite 3.54.1 (its `sqlite3/sqlite3.h`).
rusqlite = { version = "0.41.1", features = ["bundled"] }
# Wall-clock Return time in the Mac's current time zone and in the IANA zone
# given to `dev_clock_set`. Reads the operating system's zoneinfo.
jiff = "0.2.38"
tempfile = "3.27.0"
# HTTP client for the GitHub REST and GraphQL APIs. `native-tls` uses
# Security.framework on macOS; the default rustls build pulls in aws-lc-sys,
# whose licenses are outside deny.toml. `system-proxy` follows the macOS proxy
# settings. docs/tasks/M2.md, "Dependencies".
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "http2", "system-proxy"] }
# The macOS Keychain (generic passwords). Only the daemon uses it.
security-framework = "3.7.0"
